[project]
name = "forge-foundry-claude-tooling"
version = "0.1.0"
description = "Vendor tooling + parity tests for the forge-foundry-claude plugin"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# engine/ and skills/ are vendored verbatim from forge-foundry-primitives; they are
# not authored here and must not be reformatted or re-linted (see CHANGELOG-VENDOR.md).
extend-exclude = ["engine", "skills"]
